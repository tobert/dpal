<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img">
  <title>dpal — Your Pal DeepSeek</title>
  <desc>Friendly whale character on the left with face. 'dpal' wordmark in bold blue-cyan gradient on the right. Tagline 'YOUR PAL DEEPSEEK' beneath. Bubbles scattered across the banner. Transparent background.</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5BB4FF"/>
      <stop offset="55%"  stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#00C2D7"/>
    </linearGradient>
    <radialGradient id="gloss" cx="32%" cy="26%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Bubbles: each = translucent gradient fill + thin ring + small white catchlight -->
  <!-- Rising column above the blowhole -->
  <circle cx="285" cy="65" r="10" fill="url(#grad)" fill-opacity="0.40"/>
  <circle cx="285" cy="65" r="10" fill="none" stroke="#5BB4FF" stroke-opacity="0.60" stroke-width="1.5"/>
  <circle cx="281" cy="61" r="1.8" fill="#ffffff" fill-opacity="0.70"/>
  <circle cx="310" cy="40" r="6" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="310" cy="40" r="6" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="307.6" cy="37.6" r="1.08" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="325" cy="92" r="5" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="325" cy="92" r="5" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="323" cy="90" r="0.9" fill="#ffffff" fill-opacity="0.60"/>
  <!-- Left of the whale -->
  <circle cx="90" cy="220" r="14" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="90" cy="220" r="14" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="84.4" cy="214.4" r="2.52" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="75" cy="290" r="9" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="75" cy="290" r="9" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="71.4" cy="286.4" r="1.62" fill="#ffffff" fill-opacity="0.60"/>
  <!-- Underside / belly area -->
  <circle cx="170" cy="410" r="11" fill="url(#grad)" fill-opacity="0.35"/>
  <circle cx="170" cy="410" r="11" fill="none" stroke="#5BB4FF" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="165.6" cy="405.6" r="1.98" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="360" cy="430" r="18" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="360" cy="430" r="18" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="352.8" cy="422.8" r="3.24" fill="#ffffff" fill-opacity="0.60"/>
  <!-- Right half — balances the wide canvas -->
  <circle cx="1380" cy="110" r="16" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="1380" cy="110" r="16" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="1373.6" cy="103.6" r="2.88" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="1420" cy="70" r="9" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="1420" cy="70" r="9" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="1416.4" cy="66.4" r="1.62" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="1340" cy="440" r="13" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="1340" cy="440" r="13" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="1334.8" cy="434.8" r="2.34" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="1410" cy="410" r="8" fill="url(#grad)" fill-opacity="0.30"/>
  <circle cx="1410" cy="410" r="8" fill="none" stroke="#5BB4FF" stroke-opacity="0.50" stroke-width="1.5"/>
  <circle cx="1406.8" cy="406.8" r="1.44" fill="#ffffff" fill-opacity="0.60"/>
  <circle cx="1100" cy="75" r="10" fill="url(#grad)" fill-opacity="0.25"/>
  <circle cx="1100" cy="75" r="10" fill="none" stroke="#5BB4FF" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="1096" cy="71" r="1.8" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="1140" cy="440" r="7" fill="url(#grad)" fill-opacity="0.25"/>
  <circle cx="1140" cy="440" r="7" fill="none" stroke="#5BB4FF" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="1137.2" cy="437.2" r="1.26" fill="#ffffff" fill-opacity="0.55"/>

  <!-- Whale: body + tail in one closed path. Eyes/smile/spout overlay separately. -->
  <g filter="url(#shadow)">
    <path d="M 290 130 Q 145 130 150 250 Q 145 370 290 370 Q 380 370 395 280 Q 440 300 510 335 Q 545 335 540 305 Q 525 270 470 250 Q 525 230 540 195 Q 545 165 510 165 Q 440 200 395 220 Q 380 130 290 130 Z"
          fill="url(#grad)" stroke="url(#grad)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 290 130 Q 145 130 150 250 Q 145 370 290 370 Q 380 370 395 280 Q 440 300 510 335 Q 545 335 540 305 Q 525 270 470 250 Q 525 230 540 195 Q 545 165 510 165 Q 440 200 395 220 Q 380 130 290 130 Z"
          fill="url(#gloss)"/>

    <circle cx="220" cy="230" r="14" fill="#ffffff"/>
    <circle cx="304" cy="230" r="14" fill="#ffffff"/>
    <path d="M 232 285 Q 262 308 292 285" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

    <ellipse cx="255" cy="100" rx="8" ry="13" fill="url(#grad)" opacity="0.7"/>
    <ellipse cx="278" cy="82"  rx="6" ry="10" fill="url(#grad)" opacity="0.55"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="620" y="305"
        font-family="'Helvetica Neue', 'Arial Black', 'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-size="200" font-weight="900"
        fill="url(#grad)" stroke="url(#grad)" stroke-width="8" stroke-linejoin="round"
        letter-spacing="-6">dpal</text>

  <text x="624" y="410"
        font-family="'Helvetica Neue', 'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600"
        fill="#4D6BFE" letter-spacing="4">YOUR PAL DEEPSEEK</text>
</svg>
